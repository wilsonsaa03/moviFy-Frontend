<app-auth-layout
  volverRuta="/registro"
  volverTexto="Volver"
  chip="Panel de gestión"
  tituloInicio="Administra"
  tituloResaltado="MoviFY"
  texto="Crea tu cuenta de administrador para validar conductores, supervisar las solicitudes y gestionar la plataforma."
  [etiquetas]="etiquetasAdmin">

  <div class="fm-marca">
    <img src="assets/brand/movify-isotipo.svg" alt="" width="34" height="42">
    <span class="fm-wordmark">Movi<span>FY</span></span>
  </div>

  <h1 class="fm-h1">Registro de administrador</h1>
  <p class="fm-sub">Gestiona usuarios, conductores y servicios.</p>

  <form (ngSubmit)="registrar()" novalidate>

    <!-- NOMBRE -->
    <label class="fm-label" for="ra-nombre">Nombre completo</label>
    <div class="fm-campo">
      <svg class="fm-campo-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <input id="ra-nombre" type="text" name="nombre" autocomplete="name"
             [(ngModel)]="datos.nombre" placeholder="Tu nombre y apellido" required>
    </div>

    <!-- CORREO -->
    <label class="fm-label" for="ra-correo">Correo electrónico</label>
    <div class="fm-campo">
      <svg class="fm-campo-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
      <input id="ra-correo" type="email" name="correo" autocomplete="email"
             [(ngModel)]="datos.correo" placeholder="tu@correo.com" required>
    </div>

    <!-- CONTRASEÑAS en dos columnas -->
    <div class="ra-fila">
      <div>
        <label class="fm-label" for="ra-password">Contraseña</label>
        <div class="fm-campo">
          <svg class="fm-campo-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="ra-password" [type]="mostrarPassword ? 'text' : 'password'" name="password" autocomplete="new-password"
                 [(ngModel)]="datos.password" placeholder="Contraseña" required>
          <button type="button" class="fm-ojo" (click)="mostrarPassword = !mostrarPassword"
                  [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'" [attr.aria-pressed]="mostrarPassword">
            @if (mostrarPassword) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2.5 12 2.5 12S6 19 12 19a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>
      </div>
      <div>
        <label class="fm-label" for="ra-confirmar">Confirmar contraseña</label>
        <div class="fm-campo">
          <svg class="fm-campo-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="ra-confirmar" [type]="mostrarConfirmar ? 'text' : 'password'" name="confirmar" autocomplete="new-password"
                 [(ngModel)]="confirmar" placeholder="Repítela" required>
          <button type="button" class="fm-ojo" (click)="mostrarConfirmar = !mostrarConfirmar"
                  [attr.aria-label]="mostrarConfirmar ? 'Ocultar confirmación' : 'Mostrar confirmación'" [attr.aria-pressed]="mostrarConfirmar">
            @if (mostrarConfirmar) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2.5 12 2.5 12S6 19 12 19a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>
      </div>
    </div>

    <!-- CÓDIGO DE ADMINISTRADOR -->
    <label class="fm-label" for="ra-codigo">Código de administrador</label>
    <div class="fm-campo">
      <svg class="fm-campo-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
      <input id="ra-codigo" type="text" name="codigoAdmin" autocomplete="off"
             [(ngModel)]="datos.codigoAdmin" placeholder="Código de acceso" required>
    </div>

    @if (error) {
      <div class="fm-alerta fm-alerta-error" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <span>{{ error }}</span>
      </div>
    }
    @if (exito) {
      <div class="fm-alerta fm-alerta-exito" role="status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
        <span>{{ exito }}</span>
      </div>
    }

    <button type="submit" class="fm-btn" [disabled]="cargando">
      @if (cargando) {
        <span class="fm-spinner" aria-hidden="true"></span>
        Registrando…
      } @else {
        Crear cuenta de administrador
      }
    </button>
  </form>

  <p class="fm-pie">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>

</app-auth-layout>
