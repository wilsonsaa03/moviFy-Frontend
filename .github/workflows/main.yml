name: 🚀 Frontend MoviFY

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Build de producción
        run: npm run build -- --configuration production

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/browser
          include-hidden-files: true   # incluye el .htaccess
          retention-days: 7

  # Sube la versión nueva a una carpeta aparte y la cambia de un solo golpe:
  # el sitio nunca queda vacío mientras se suben los archivos.
  deploy:
    name: Desplegar
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: nuevo

      - name: Subir a carpeta temporal
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "nuevo/"
          target: "/var/www/ds2/movify/movify-frontend-nuevo"
          strip_components: 1
          rm: true

      - name: Publicar (cambio atómico)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /var/www/ds2/movify
            test -f movify-frontend-nuevo/index.html
            rm -rf movify-frontend-anterior
            [ -d movify-frontend ] && mv movify-frontend movify-frontend-anterior
            mv movify-frontend-nuevo movify-frontend
            echo "Publicado:" && ls -la movify-frontend | head
